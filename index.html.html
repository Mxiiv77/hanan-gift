<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لأجلكِ فقط ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #ff3838;
            --primary-hover: #ff4d4d;
            --accent: #d1d8e0;
            --bg-gradient: linear-gradient(135deg, #07050b 0%, #151022 50%, #0a0712 100%);
            --card-bg: rgba(20, 15, 30, 0.75);
            --card-border: rgba(255, 56, 56, 0.2);
            --text-main: #ffffff;
            --text-sub: #dcdde1;
            --shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        .falling-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .falling-element {
            position: absolute;
            top: -10%;
            font-size: 1.3rem;
            user-select: none;
            animation: fall linear infinite;
            opacity: 0.5;
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 0.7; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        .glow-bg {
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(255, 56, 56, 0.12) 0%, rgba(130, 88, 159, 0.05) 50%, rgba(0, 0, 0, 0) 70%);
            top: 15%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
            filter: blur(50px);
        }

        .container {
            position: relative;
            z-index: 1;
            background: var(--card-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--card-border);
            border-radius: 35px;
            padding: 40px 30px;
            width: 100%;
            max-width: 600px;
            box-shadow: var(--shadow);
            text-align: center;
            transition: all 0.4s ease;
        }

        .lock-icon {
            font-size: 4rem;
            margin-bottom: 15px;
            display: inline-block;
            filter: drop-shadow(0 6px 20px rgba(255, 56, 56, 0.4));
        }

        h1 {
            font-size: 1.9rem;
            font-weight: 800;
            margin-bottom: 15px;
            color: #ff5252;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            letter-spacing: -0.5px;
        }

        p.desc {
            font-size: 1.05rem;
            color: var(--text-sub);
            margin-bottom: 25px;
            line-height: 1.8;
        }

        .input-group {
            position: relative;
            margin-bottom: 18px;
        }

        input[type="password"], input[type="text"] {
            width: 100%;
            padding: 16px 20px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            font-size: 1.15rem;
            text-align: center;
            outline: none;
            transition: 0.3s;
        }

        input[type="password"]:focus, input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(255, 56, 56, 0.3);
        }

        button.btn-main {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), #ff5252);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 18px;
            font-size: 1.15rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(255, 56, 56, 0.35);
            transition: 0.3s;
        }

        button.btn-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(255, 56, 56, 0.5);
        }

        .hint-box {
            margin-top: 18px;
            padding: 12px;
            border-radius: 14px;
            background: rgba(255, 56, 56, 0.12);
            color: #ff5252;
            font-size: 0.95rem;
            display: none;
        }

        .music-card {
            background: rgba(10, 7, 18, 0.9);
            border-radius: 22px;
            padding: 20px;
            margin: 20px 0;
            border: 1px solid rgba(255, 56, 56, 0.2);
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: inset 0 2px 8px rgba(255, 255, 255, 0.03);
        }

        .album-art-container {
            width: 85px;
            height: 85px;
            margin: 0 auto;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid var(--primary);
            box-shadow: 0 8px 20px rgba(255, 56, 56, 0.4);
            animation: pulse-art 3s infinite ease-in-out;
            background: linear-gradient(135deg, #ff5252 0%, #82589f 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .music-icon-symbol {
            font-size: 2.2rem;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.4));
        }

        @keyframes pulse-art {
            0%, 100% { transform: scale(1); box-shadow: 0 8px 20px rgba(255, 56, 56, 0.3); }
            50% { transform: scale(1.06); box-shadow: 0 12px 25px rgba(255, 56, 56, 0.6); }
        }

        .music-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 1.08rem;
            font-weight: 700;
            color: #ff8787;
        }

        audio {
            width: 100%;
            height: 45px;
            border-radius: 12px;
            outline: none;
        }

        .message-content {
            font-size: 1.12rem;
            line-height: 2.2;
            color: #f5f6fa;
            white-space: pre-line;
            margin: 20px 0;
            text-align: right;
            background: rgba(10, 7, 18, 0.75);
            padding: 28px;
            border-radius: 22px;
            border-right: 5px solid var(--primary);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .locked-view {
            text-align: center;
            padding: 40px 20px;
            background: rgba(10, 7, 18, 0.85);
            border-radius: 22px;
            border: 1px dashed rgba(255, 56, 56, 0.4);
            margin: 20px 0;
        }

        .locked-icon-big {
            font-size: 3.5rem;
            margin-bottom: 15px;
        }

        .timer-display {
            font-size: 1.8rem;
            font-weight: 800;
            color: #ff5252;
            margin: 15px 0;
            font-family: monospace;
            letter-spacing: 2px;
        }

        .btn-timer {
            background: linear-gradient(135deg, #ff3838, #ff5252);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 14px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 56, 56, 0.4);
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-timer:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 56, 56, 0.6);
        }

        .secret-bypass-trigger {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 55px;
            height: 55px;
            background: rgba(255, 56, 56, 0.15);
            border: 2px solid rgba(255, 56, 56, 0.4);
            border-radius: 50%;
            cursor: pointer;
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            box-shadow: 0 4px 15px rgba(255, 56, 56, 0.3);
            transition: 0.3s;
        }
        .secret-bypass-trigger:hover {
            transform: scale(1.1);
            background: rgba(255, 56, 56, 0.35);
            border-color: var(--primary);
        }

        .secret-box {
            margin-top: 15px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            border: 1px solid rgba(255, 56, 56, 0.3);
            display: none;
        }

        .days-nav {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            max-height: 230px;
            overflow-y: auto;
            padding-left: 4px;
            padding-right: 4px;
        }

        .day-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #b2bec3;
            padding: 12px 6px;
            border-radius: 14px;
            font-size: 0.85rem;
            cursor: pointer;
            text-align: center;
            transition: all 0.25s ease;
        }

        .day-btn:hover {
            background: rgba(255, 56, 56, 0.2);
            color: #fff;
            transform: translateY(-2px);
        }

        .day-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 5px 15px rgba(255, 56, 56, 0.4);
        }

        .day-btn.locked {
            opacity: 0.4;
            cursor: not-allowed;
            border-style: dashed;
        }

        .hidden {
            display: none !important;
        }

        .shake {
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
    </style>
</head>
<body>

    <div class="falling-container" id="fallingContainer"></div>
    <div class="glow-bg"></div>

    <div class="secret-bypass-trigger" onclick="toggleSecretInput()" title="كود التجاوز">🔑</div>

    <div class="container" id="loginCard">
        <div class="lock-icon">🔐</div>
        <h1>مكاني الخاص مع حنان ❤️</h1>
        <p class="desc">هذا المكان ما يفتحه أحد غيرنا.. حطي الرقم الخاص بينا عشان تفتحي الحكايات والذكريات.</p>
        
        <div class="input-group">
            <input type="password" id="passwordInput" placeholder="أدخلي الرقم..." onkeypress="handleKeyPress(event)">
        </div>
        
        <button class="btn-main" onclick="checkPassword()">افتحي الذكريات ✨</button>
        
        <div id="hintBox" class="hint-box"></div>
    </div>

    <div class="container hidden" id="contentCard">
        <h1 id="dayTitle">اليوم</h1>
        
        <div id="unlockedContent">
            <div class="music-card">
                <div class="album-art-container">
                    <span class="music-icon-symbol">🎵</span>

                <div class="music-info"><span id="songName">اسم الأغنية</span></div>
                <audio id="audioPlayer" controls preload="auto"></audio>
            </div>

            <div class="message-content" id="dayMessage">جاري التحميل...</div>
        </div>

        <div id="lockedView" class="locked-view hidden">
            <div class="locked-icon-big" id="lockedIconSymbol">⏳🔒</div>
            <h3 id="lockedTitle" style="color: #ff5252; margin-bottom: 10px;">هذا اليوم مقفل حالياً</h3>
            <p id="lockedDesc" style="color: var(--text-sub); font-size: 0.95rem; margin-bottom: 15px;">يجب فتح الأيام السابقة بالترتيب أولاً.</p>
            <div id="timerDisplay" class="timer-display hidden">24:00:00</div>

            <div id="secretBox" class="secret-box">
                <p style="font-size: 0.85rem; color: #ff8787; margin-bottom: 8px;">معاك كود تخطي لهذا اليوم؟ حطه هنا:</p>
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="secretCodeInput" placeholder="أدخل الكود..." style="padding: 10px; font-size: 0.95rem;">
                    <button onclick="verifySecretCode()" style="background: var(--primary); color: #fff; border: none; padding: 0 15px; border-radius: 12px; cursor: pointer; font-weight: 700;">فتح</button>
                </div>
            </div>
        </div>

        <div class="days-nav" id="daysNav"></div>
    </div>

        const dayKeys = Object.keys(dailyContent);
        let activeInterval = null;

        function handleKeyPress(e) {
            if (e.key === 'Enter') checkPassword();
        }

        function checkPassword() {
            const input = document.getElementById("passwordInput").value;
            const card = document.getElementById("loginCard");
            const hintBox = document.getElementById("hintBox");

            if (input === PASSWORD) {
                card.style.transform = "scale(0.95)";
                card.style.opacity = "0";
                setTimeout(() => {
                    card.classList.add("hidden");
                    const contentCard = document.getElementById("contentCard");
                    contentCard.classList.remove("hidden");
                    loadInitialDay();
                }, 300);
            } else {
                card.classList.add("shake");
                setTimeout(() => card.classList.remove("shake"), 400);
                hintBox.style.display = "block";
                hintBox.innerText = "الرقم مو مضبوط، ركزي في الرقم الخاص بينا! (77)";
            }
        }

        function getUnlockedDays() {
            return JSON.parse(localStorage.getItem("unlocked_days")) || ["16 أكتوبر"];
        }

        function unlockDay(dayKey) {
            let unlocked = getUnlockedDays();
            if (!unlocked.includes(dayKey)) {
                unlocked.push(dayKey);
                localStorage.setItem("unlocked_days", JSON.stringify(unlocked));
            }
        }

        function getTimerData(dayKey) {
            return JSON.parse(localStorage.getItem("timer_" + dayKey));
        }

        function saveTimerData(dayKey, endTime) {
            localStorage.setItem("timer_" + dayKey, JSON.stringify({ endTime: endTime }));
        }

        function loadInitialDay() {
            showDayContent(dayKeys[0]);
            renderDaysNav(dayKeys[0]);
        }

        function triggerConfetti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 120,
                    spread: 80,
                    origin: { y: 0.6 },
                    colors: ['#ff3838', '#d1d8e0', '#ff5252', '#82589f']
                });
            }
        }

        function toggleSecretInput() {
            const secretBox = document.getElementById("secretBox");
            secretBox.style.display = secretBox.style.display === "block" ? "none" : "block";
        }

        function verifySecretCode() {
            const activeBtn = document.querySelector(".day-btn.active");
            if (!activeBtn) return;
            const currentDayKey = activeBtn.getAttribute("data-day");
            const inputCode = document.getElementById("secretCodeInput").value.trim();

            const expectedCode = dailyContent[currentDayKey].secretCode;

            if (inputCode === expectedCode) {
                unlockDay(currentDayKey);
                localStorage.removeItem("timer_" + currentDayKey);
                document.getElementById("secretCodeInput").value = "";
                document.getElementById("secretBox").style.display = "none";
                showDayContent(currentDayKey);
                renderDaysNav(currentDayKey);
                triggerConfetti();
            } else {
                alert("الكود خطأ! تأكدي من الكود الخاص بهذا اليوم.");
            }
        }

        function showDayContent(dayKey) {
            if (activeInterval) clearInterval(activeInterval);

            const data = dailyContent[dayKey];
            const titleElem = document.getElementById("dayTitle");
            const msgElem = document.getElementById("dayMessage");
            const songNameElem = document.getElementById("songName");
            const audioPlayer = document.getElementById("audioPlayer");
            
            const unlockedContent = document.getElementById("unlockedContent");
            const lockedView = document.getElementById("lockedView");

            let unlockedDays = getUnlockedDays();
            
            if (unlockedDays.includes(dayKey)) {
                titleElem.innerText = data.title;
                unlockedContent.classList.remove("hidden");
                lockedView.classList.add("hidden");

                msgElem.innerText = data.message;
                songNameElem.innerText = data.songName || "إهداء خاص";
                
                if (data.audioUrl) {
                    audioPlayer.src = data.audioUrl;
                    audioPlayer.load();
                    audioPlayer.currentTime = 0;
                    audioPlayer.play().catch(() => {});
                }

                if (data.isBirthday) {
                    triggerConfetti();
                }
            } else {
                titleElem.innerText = dayKey + " 🔒";
                unlockedContent.classList.add("hidden");
                lockedView.classList.remove("hidden");
                audioPlayer.pause();

                manageSequentialTimer(dayKey);
            }
        }

        function manageSequentialTimer(dayKey) {
            const timerDisplay = document.getElementById("timerDisplay");
            const startBtn = document.getElementById("startTimerBtn");
            const lockedDesc = document.getElementById("lockedDesc");
            const lockedIconSymbol = document.getElementById("lockedIconSymbol");

            let unlockedDays = getUnlockedDays();
            const currentIndex = dayKeys.indexOf(dayKey);
            const prevDayKey = dayKeys[currentIndex - 1];

            const isNextInLine = unlockedDays.includes(prevDayKey);

            if (!isNextInLine) {
                timerDisplay.classList.add("hidden");
                startBtn.classList.add("hidden");
                lockedIconSymbol.innerText = "🔒";
                lockedDesc.innerText = "يجب فتح الأيام السابقة بالترتيب أولاً للوصول إلى هذا اليوم.";
            } else {
                lockedIconSymbol.innerText = "⏳🔒";
                let timerData = getTimerData(dayKey);

                if (!timerData) {
                    timerDisplay.classList.add("hidden");
                    startBtn.classList.remove("hidden");
                    lockedDesc.innerText = "اضغطي زر بدء العد التنازلي لتبدأ الـ 24 ساعة الخاصة بهذا اليوم!";
                } else {
                    startBtn.classList.add("hidden");
                    timerDisplay.classList.remove("hidden");
                    lockedDesc.innerText = "الوقت باقي ليفتح هذا اليوم:";
                    runCountdown(timerData.endTime, dayKey);
                }
            }
        }

        function startCurrentDayTimer() {
            const activeBtn = document.querySelector(".day-btn.active");
            if (!activeBtn) return;
            const currentBtnKey = activeBtn.getAttribute("data-day");
            
            const duration = 24 * 60 * 60 * 1000; 
            const endTime = new Date().getTime() + duration;
            
            saveTimerData(currentBtnKey, endTime);
            manageSequentialTimer(currentBtnKey);
        }

        function runCountdown(endTime, dayKey) {
            const timerDisplay = document.getElementById("timerDisplay");

            if (activeInterval) clearInterval(activeInterval);

            activeInterval = setInterval(() => {
                const now = new Date().getTime();
                const distance = endTime - now;

                if (distance <= 0) {
                    clearInterval(activeInterval);
                    timerDisplay.innerText = "00:00:00";
                    unlockDay(dayKey);
                    localStorage.removeItem("timer_" + dayKey);
                    showDayContent(dayKey);
                    renderDaysNav(dayKey);
                } else {
                    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                    timerDisplay.innerText = 
                        String(hours).padStart(2, '0') + ":" + 
                        String(minutes).padStart(2, '0') + ":" + 
                        String(seconds).padStart(2, '0');
                }
            }, 1000);
        }

        function renderDaysNav(activeDayKey) {
            const nav = document.getElementById("daysNav");
            nav.innerHTML = "";
            let unlockedDays = getUnlockedDays();

            dayKeys.forEach((dk) => {
                const btn = document.createElement("button");
                btn.setAttribute("data-day", dk);
                
                let isUnlocked = unlockedDays.includes(dk);
                
                btn.className = `day-btn ${dk === activeDayKey ? 'active' : ''} ${!isUnlocked ? 'locked' : ''}`;
                btn.innerText = `${dk} ${!isUnlocked ? '🔒' : ''}`;

                btn.onclick = () => {
                    showDayContent(dk);
                    document.querySelectorAll(".day-btn").forEach(b => b.classList.remove("active"));
                    btn.classList.add("active");
                };
                nav.appendChild(btn);
            });
        }
    </script>
